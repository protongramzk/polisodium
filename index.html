<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Polisodium</title>
  <style>
    :root { color-scheme: dark; background:#111; color:#eee; font-family:Arial,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; justify-content:center; background:#111; }
    main { width:min(100vw, 480px); padding:10px 0 18px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    #game-wrap, #controls-wrap { width:100%; aspect-ratio:160 / 144; }
    #game-wrap canvas, #controls { display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none; }
    #controls-wrap { margin-top:0; }
    .hint { width:100%; padding:0 12px; color:#aaa; font-size:12px; text-align:center; line-height:1.4; }
    #error { color:#ff8a8a; font-size:12px; padding:0 12px; text-align:center; }
  </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
  rel="stylesheet"
>

</head>
<body>
  <main>
    <div id="game-wrap"></div>
    <div id="controls-wrap"><canvas id="controls" width="160" height="144" aria-label="Kontrol game"></canvas></div>
    <div id="error"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <script src="./story-data.js"></script>
  <script src="./data.js"></script>
  <script src="./game.js"></script>
</body>
</html>
