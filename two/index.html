<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZKK OSBee-Y Game Engine</title>
    <!-- Import Font Silkscreen (Game) & Open Sans (UI Emulator) -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&family=Silkscreen&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #121214;
            color: #fff;
            overflow: hidden;
            font-family: 'Open Sans', sans-serif;
        }
/* Container Overlay di Atas Canvas */
#loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(18, 18, 20, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

#loading-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

/* Track Batang Loading (Height 10px, Rounded) */
.progress-track {
    width: 80%;
    max-width: 220px;
    height: 10px;
    background: #2a2a32;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
    transform: translateY(-2px); /* Penyesuaian offset 2px di atas visual canvas */
}

/* Fill Bar dengan Gradient Mengkilap & Animasi Shimmer */
.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        #4caf50 0%,
        #81c784 50%,
        #4caf50 100%
    );
    background-size: 200% 100%;
    animation: shineWave 1.2s infinite linear;
    transition: width 0.15s ease-out;
}

@keyframes shineWave {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* Teks Status Loading */
.loading-status-text {
    font-family: 'Silkscreen', monospace;
    font-size: 8px;
    color: #81c784;
    margin-top: 8px;
    letter-spacing: 0.5px;
}

        /* Container Utama Terpusat secara Vertikal */
        .emulator-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 12px 16px env(safe-area-inset-bottom, 12px) 16px;
        }

        /* Area Canvas Emulator yang Membesar Otomatis */
        #game-container {
            flex: 1;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 144 / 160;
            max-height: 55dvh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Panel Kontrol Layar Sentuh */
        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 8px 4px 12px 4px;
        }

        /* D-Pad Silang ala GBC */
        .dpad {
            position: relative;
            width: 136px;
            height: 136px;
        }
        .dpad-btn {
            position: absolute;
            background: #2a2a32;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: opacity 0.08s ease;
            outline: none;
        }
        .dpad-btn:active, .dpad-btn.active {
            opacity: 0.35;
        }
        #btn-up {
            top: 0; left: 44px; width: 48px; height: 48px;
            border-radius: 8px 8px 0 0;
        }
        #btn-down {
            bottom: 0; left: 44px; width: 48px; height: 48px;
            border-radius: 0 0 8px 8px;
        }
        #btn-left {
            top: 44px; left: 0; width: 48px; height: 48px;
            border-radius: 8px 0 0 8px;
        }
        #btn-right {
            top: 44px; right: 0; width: 48px; height: 48px;
            border-radius: 0 8px 8px 0;
        }
        /* Pusat D-Pad */
        .dpad::after {
            content: '';
            position: absolute;
            top: 44px; left: 44px; width: 48px; height: 48px;
            background: #2a2a32;
            pointer-events: none;
        }

        /* Tombol A & B Pas Jari */
        .ab-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
            transform: translateY(-4px);
        }
        .btn-round {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #363640;
            color: #f1f1f3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Open Sans', sans-serif;
            font-size: 20px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            outline: none;
            transition: opacity 0.08s ease;
        }
        .btn-round:active, .btn-round.active {
            opacity: 0.35;
        }

        /* Posisi Tombol B Sedikit Lebih Rendah Khas Controller */
        #btn-b {
            transform: translateY(10px);
        }

        /* Informasi Panduan */
        .info-panel {
            font-family: 'Silkscreen', monospace;
            font-size: 7px;
            color: #555560;
            text-align: center;
            letter-spacing: 0.5px;
            padding-bottom: 4px;
        }
/* Animasi Border Wave Gradient di Canvas */
canvas.wave-border {
    border: 3px solid transparent !important;
    border-image: linear-gradient(
        45deg,
        #4caf50,
        #f44336,
        #795548,
        #4caf50
    ) 1 !important;
    animation: waveBorderAnim 1.5s infinite linear;
}

@keyframes waveBorderAnim {
    0% {
        filter: hue-rotate(0deg);
    }
    100% {
        filter: hue-rotate(360deg);
    }
}

    </style>
</head>
<body>

<div class="emulator-layout">
    <!-- Area Canvas Emulator -->
    <div id="game-container"></div>

    <!-- Panel Kontrol Layar Sentuh -->
    <div class="controls-panel">
        <div class="dpad">
            <button class="dpad-btn" id="btn-up">▲</button>
            <button class="dpad-btn" id="btn-left">◄</button>
            <button class="dpad-btn" id="btn-right">►</button>
            <button class="dpad-btn" id="btn-down">▼</button>
        </div>
        <div class="ab-buttons">
            <button class="btn-round" id="btn-b">B</button>
            <button class="btn-round" id="btn-a">A</button>
        </div>
    </div>

    <!-- Info Bawah -->
    <div class="info-panel">
        [A] / ENTER : INTERAKSI &nbsp;•&nbsp; [B] / ESC : BATAL
    </div>
</div>
<div id="game-container">
    <!-- HTML Overlay Bar -->
    <div id="loading-overlay">
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loading-status-text" id="loading-status-text">MEMUAT 0%</div>
    </div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
